# Local environment for the ARXATEC MVP (equivalent to XAMPP: Apache + PHP + MariaDB).
# The code connects with mysqli_connect("localhost", "root", "", "arxatec"), which in
# PHP means a Unix socket, so the MariaDB socket is shared with the web container
# through the "mysqld-socket" volume and the original code runs unchanged.
name: arxatec

services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
      TZ: America/Lima
    volumes:
      - db-data:/var/lib/mysql
      - mysqld-socket:/run/mysqld
      - ./mariadb/charset.cnf:/etc/mysql/conf.d/charset.cnf:ro
      - ../database/sql.txt:/docker-entrypoint-initdb.d/01-arxatec.sql:ro
    ports:
      - "${DB_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  web:
    build: ./php
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: America/Lima
    volumes:
      - ..:/var/www/html
      - mysqld-socket:/run/mysqld
    ports:
      - "${WEB_PORT:-8090}:80"

  phpmyadmin:
    image: phpmyadmin:5.2
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ""
    volumes:
      - ./phpmyadmin/config.user.inc.php:/etc/phpmyadmin/config.user.inc.php:ro
    ports:
      - "${PMA_PORT:-8091}:80"

volumes:
  db-data:
  mysqld-socket:
